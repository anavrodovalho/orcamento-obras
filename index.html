<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orçamento de Obras · Habitar Engenharia</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#052F34">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orçamentos">
  <link rel="icon" href="assets/favicon.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="assets/icone-180.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3">
  <link rel="stylesheet" href="css/orcamento.css?v=4">
  <script src="js/theme.js"></script>
</head>
<body>

  <!-- ───────── Login ───────── -->
  <main id="tela-login" class="login" hidden>
    <form id="form-login" class="login-caixa" novalidate>
      <img class="login-logo" src="assets/logo-engenharia-vertical.png" alt="Habitar Engenharia &amp; Incorporação">
      <h1>Orçamento de Obras</h1>
      <label class="rotulo">Usuário
        <input id="login-usuario" class="campo" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="rotulo">Senha
        <input id="login-senha" class="campo" type="password" autocomplete="current-password" required>
      </label>
      <button id="login-botao" class="botao botao-primario botao-largo" type="submit">Entrar</button>
      <p id="login-aviso" class="aviso-erro" hidden></p>
      <button class="botao-fantasma login-tema" type="button" data-acao="alternar-tema" aria-label="Alternar tema">
        <span class="icone-sol" aria-hidden="true">☀</span><span class="icone-lua" aria-hidden="true">☾</span>
      </button>
    </form>
  </main>

  <!-- ───────── Aplicação ───────── -->
  <div id="tela-app" class="app" hidden>
    <aside class="menu" aria-label="Menu principal">
      <div class="menu-logo">
        <img class="logo-completa" src="assets/logo-engenharia.png" alt="Habitar Engenharia &amp; Incorporação">
        <img class="logo-simbolo" src="assets/logo-simbolo.png" alt="Habitar Engenharia">
      </div>
      <nav class="menu-itens">
        <a href="#/orcamentos" data-rota="orcamentos" class="menu-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6M10 8h2"/></svg>
          <span>Orçamentos</span>
        </a>
        <a href="#/sinapi" data-rota="sinapi" class="menu-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <span>Base SINAPI</span>
        </a>
        <a href="#/modelo" data-rota="modelo" class="menu-item">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>
          <span>Modelo de itens</span>
        </a>
      </nav>
      <div class="menu-rodape">
        <span class="avatar" id="menu-avatar" aria-hidden="true"></span>
        <div class="menu-usuario">
          <strong id="menu-nome"></strong>
          <button type="button" class="link-claro" data-acao="sair">Sair</button>
        </div>
      </div>
    </aside>

    <div class="principal">
      <header class="topo">
        <h1 id="topo-titulo">Orçamentos</h1>
        <div class="topo-acoes">
          <button class="botao-icone" type="button" data-acao="atualizar" aria-label="Recarregar dados" title="Recarregar dados">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button class="botao-icone" type="button" data-acao="alternar-tema" aria-label="Alternar tema">
            <span class="icone-sol" aria-hidden="true">☀</span><span class="icone-lua" aria-hidden="true">☾</span>
          </button>
          <span class="topo-usuario">
            <span class="avatar avatar-pequeno" id="topo-avatar" aria-hidden="true"></span>
            <span id="topo-nome"></span>
          </span>
          <button class="botao botao-secundario botao-sair" type="button" data-acao="sair">Sair</button>
        </div>
      </header>

      <main class="conteudo">
        <section id="vista-orcamentos" class="vista" hidden></section>
        <section id="vista-orcamento" class="vista" hidden></section>
        <section id="vista-sinapi" class="vista" hidden></section>
        <section id="vista-modelo" class="vista" hidden></section>
      </main>
    </div>

    <nav class="menu-inferior" aria-label="Menu">
      <a href="#/orcamentos" data-rota="orcamentos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6M10 8h2"/></svg><span>Orçamentos</span></a>
      <a href="#/sinapi" data-rota="sinapi"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span>SINAPI</span></a>
      <a href="#/modelo" data-rota="modelo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg><span>Modelo</span></a>
    </nav>
  </div>

  <!-- ───────── Proposta para imprimir / salvar em PDF ───────── -->
  <div id="impressao" class="impressao" hidden>
    <div class="impressao-barra">
      <button class="botao botao-secundario" type="button" data-acao="fechar-impressao">← Voltar ao orçamento</button>
      <span class="impressao-dica">No diálogo de impressão, escolha <strong>Salvar como PDF</strong>.</span>
      <button class="botao botao-primario" type="button" data-acao="imprimir">Imprimir / Salvar PDF</button>
    </div>
    <div id="impressao-folha" class="folha"></div>
  </div>

  <!-- ───────── Modal genérico ───────── -->
  <div id="modal" class="modal" hidden>
    <div class="modal-fundo" data-acao="fechar-modal"></div>
    <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <header class="modal-topo">
        <h2 id="modal-titulo"></h2>
        <button class="botao-icone" type="button" data-acao="fechar-modal" aria-label="Fechar">✕</button>
      </header>
      <div id="modal-corpo" class="modal-corpo"></div>
    </div>
  </div>

  <div id="dialogo-confirma" class="modal modal-confirma" hidden>
    <div class="modal-fundo"></div>
    <div class="modal-caixa" role="alertdialog" aria-modal="true"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/config.js?v=1"></script>
  <script src="js/utils.js?v=1"></script>
  <script src="js/api.js?v=1"></script>
  <script src="js/formula.js?v=1"></script>
  <script src="js/motor.js?v=3"></script>
  <script src="js/cronograma.js?v=3"></script>
  <script src="js/contrato.js?v=3"></script>
  <script src="js/gastos.js?v=4"></script>
  <script src="js/app.js?v=3"></script>
  <script src="js/orcamentos.js?v=4"></script>
  <script src="js/fase2.js?v=3"></script>
  <script src="js/fase3.js?v=4"></script>
  <script src="js/proposta.js?v=3"></script>
  <script src="js/consultas.js?v=3"></script>
</body>
</html>
